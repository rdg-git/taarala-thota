# DAILY TAMPER CHECK: once a day, compare the live site with the approved release on the main branch
# (tools/live_check.py). If they differ, this job fails and GitHub emails the owner.
# It can also be started by hand: GitHub → Actions → "Daily live check" → Run workflow.
name: Daily live check
on:
  schedule:
    - cron: '17 11 * * *'     # every day at 11:17 UTC (7:17 am Toronto in summer, 6:17 am in winter)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false   # don't keep GitHub's access key on the machine after downloading
      - name: Compare the live site with the approved release
        run: python3 tools/live_check.py
