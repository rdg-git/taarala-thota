<style>

/* ============ Taarala Thota — picture-backed screens ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:#05060f; color:#2D2D2D; touch-action:manipulation; }

.scr { position:fixed; inset:0; display:none; overflow:hidden; background:#05060f; }
.scr.active { display:block; }
.scr .bg { position:absolute; inset:-6%; background-size:cover; background-position:center; filter:blur(14px) brightness(.9) saturate(1.1); }
.art { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; --u:1px; }
.art > img.pic { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
.hotbox { position:absolute; pointer-events:none; }
.hotbox > .hot { pointer-events:auto; }
.hot { position:absolute; background:transparent; border:0; padding:0; cursor:pointer; z-index:5; }

/* live text drawn by the app over the pictures */

.plaque { font-family:'Fraunces',Georgia,serif; color:#ffe9b8; font-weight:700; text-shadow:0 1px 3px #000a; }

.loved-title { font-family:'Caveat',cursive; font-weight:700; color:#fff1d0; text-shadow:0 0 calc(var(--u)*24) rgba(255,210,150,.55); }
.lbl-patch { background:linear-gradient(#5b2f15,#4a2410); color:#f1d9a0; font-family:'Fraunces',Georgia,serif; border-radius:calc(var(--u)*6); z-index:3; }

/* carved wood signs */
.plank { position:absolute; z-index:5; display:flex; align-items:center; justify-content:center; gap:.35em; cursor:pointer; color:#ffe7b3; font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:.3px;
  border:calc(var(--u)*3) solid #d7a65a; border-radius:calc(var(--u)*12); background:linear-gradient(180deg,#8a5a2b,#4d2d13); box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.55), inset 0 calc(var(--u)*2) 0 rgba(255,225,160,.35); text-shadow:0 1px 2px #000a; }

.music-state { position:absolute; inset:0; display:none; pointer-events:none; }
.music-state.off { display:block; } .music-state svg { width:100%; height:100%; }
.sign-cover { position:absolute; display:flex; align-items:center; justify-content:center; z-index:3; pointer-events:none;
  background:linear-gradient(180deg,#6a4220 0%,#4a2b12 55%,#5a3719 100%); border:calc(var(--u)*5) solid #c99a4c; border-radius:calc(var(--u)*18);
  box-shadow:0 calc(var(--u)*6) calc(var(--u)*14) rgba(0,0,0,.6), inset 0 0 calc(var(--u)*22) rgba(0,0,0,.45); }

@keyframes fadein { from{opacity:0} to{opacity:1} }
.panel-card { width:min(380px,100%); background:linear-gradient(180deg,#fff7e2,#f5e3b8); border:3px solid #c99a4c; border-radius:22px; padding:22px 20px 18px; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.6); color:#3a2410; font-family:'Fraunces',Georgia,serif; }
.panel-icon { font-size:40px; margin-bottom:6px; }

.toast.out { opacity:0; }
.art.dim::after { content:''; position:absolute; inset:0; background:rgba(5,6,18,.55); z-index:40; pointer-events:none; }

/* Loved Ones */
.night { background:radial-gradient(ellipse at 50% 0%,#1d2a5e 0%,#0b1030 55%,#05060f 100%); }
.night-stars { position:absolute; inset:0; opacity:.9; background-image:
  radial-gradient(1.5px 1.5px at 12% 8%,#fff,transparent),radial-gradient(1px 1px at 30% 22%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#ffe9b0,transparent),
  radial-gradient(1px 1px at 85% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 40%,#cfe0ff,transparent),radial-gradient(1px 1px at 20% 55%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 78% 62%,#fff,transparent),radial-gradient(1px 1px at 40% 78%,#ffe9b0,transparent),radial-gradient(1px 1px at 90% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 8% 92%,#fff,transparent);
  background-size:100% 100%; }
.loved-scroll { position:absolute; overflow-y:auto; z-index:4; -webkit-overflow-scrolling:touch; }

.loved-empty { color:#ffe9c0; text-align:center; font-family:'Caveat',cursive; font-size:calc(var(--u)*58); line-height:1.3; padding-top:calc(var(--u)*220); }

/* Bubble Pop */
.blayer { position:absolute; overflow:visible; pointer-events:none; z-index:3; }
.bub { position:absolute; left:0; top:0; border-radius:50%; pointer-events:auto; cursor:pointer; will-change:transform;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 22%,transparent 40%), radial-gradient(circle at 60% 70%,var(--bc) 0%,rgba(255,255,255,.12) 62%,rgba(255,255,255,.04) 100%);
  border:calc(var(--u)*3) solid rgba(255,255,255,.65); box-shadow:0 0 calc(var(--u)*18) var(--bc), inset 0 0 calc(var(--u)*16) rgba(255,255,255,.35); }
.bub::before { content:''; position:absolute; inset:-22%; border-radius:50%; }
.bub.pop { animation:bpop .22s ease-out forwards; }
@keyframes bpop { to { opacity:0; filter:brightness(2); } }

/* Minesweeper */
.msboard { position:absolute; display:grid; gap:calc(var(--u)*5); z-index:4; padding:calc(var(--u)*6); }
.mscell { border:0; border-radius:20%; cursor:pointer; background:linear-gradient(145deg,#cdbd98,#a8966b); box-shadow:inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.4), 0 calc(var(--u)*3) 0 #6b5a36; font-family:'Fraunces',Georgia,serif; font-weight:800; display:flex; align-items:center; justify-content:center; color:#333; padding:0; touch-action:manipulation; }
.mscell.open { background:linear-gradient(145deg,#efe3c4,#e0d0a6); box-shadow:inset 0 calc(var(--u)*2) calc(var(--u)*5) rgba(90,70,30,.3); cursor:default; }
.mscell.hit { outline:calc(var(--u)*5) solid #c9792c; outline-offset:calc(var(--u)*-3); }
.mscell.bounce { animation:bnc .5s; }
@keyframes bnc { 30%{transform:translateY(-12%) scale(1.08)} 60%{transform:translateY(4%)} }

/* Chess & Checkers boards */
.cboard { position:absolute; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); z-index:4; }
.ccell { position:relative; background:none; border:0; padding:6%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ccell svg { width:100%; height:100%; pointer-events:none; filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*2) rgba(0,0,0,.45)); }
.ccell.sel, .kcell.sel { box-shadow:inset 0 0 0 calc(var(--u)*5) #ffc24d; }
.ccell.last, .kcell.last { box-shadow:inset 0 0 0 calc(var(--u)*3) rgba(255,230,160,.8); }
.ccell.chk { box-shadow:inset 0 0 0 calc(var(--u)*5) #d9822b; }
.ccell.dest::after { content:''; position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(255,194,77,.85); box-shadow:0 0 calc(var(--u)*8) #ffc24d; }
.ccell.destcap { box-shadow:inset 0 0 0 calc(var(--u)*5) rgba(255,194,77,.95); }
.pc { --f:#f6ead0; --s:#3b2a17; } .pc.b { --f:#34343f; --s:#e3cf9a; }
.pc * { fill:var(--f); stroke:var(--s); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
.pc .eye { fill:var(--s); stroke:none; }
.pc path[fill="none"] { fill:none; }
.kboard { position:absolute; display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(10,1fr); z-index:4; }
.kcell { position:relative; background:none; border:0; padding:7%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.kcell svg { width:100%; height:100%; pointer-events:none; }
.kcell.dest { box-shadow:inset 0 0 0 calc(var(--u)*3.5) rgba(255,194,77,.95); }
.kcell.dest.must { box-shadow:inset 0 0 0 calc(var(--u)*6) #ffb21a; background:rgba(255,194,77,.22); }
.capture-row { position:absolute; display:flex; flex-wrap:wrap; align-content:center; gap:0; z-index:4; pointer-events:none; }
.capture-row .cap { width:calc(var(--u)*50); height:calc(var(--u)*50); margin-right:calc(var(--u)*-8); }
.capture-row.k .cap { width:calc(var(--u)*38); height:calc(var(--u)*38); margin-right:calc(var(--u)*-4); }
.cap svg { width:100%; height:100%; }
.promo-row { display:flex; gap:10px; justify-content:center; }
.promo-btn { width:64px; height:64px; padding:6px; background:linear-gradient(180deg,#e8cf9a,#b88b4a); border:2px solid #7a4a1a; border-radius:12px; cursor:pointer; }
.promo-btn svg { width:100%; height:100%; }

/* music button: carved-wood medallion */
.music-btn { position:absolute; z-index:6; background:none; border:0; padding:0; cursor:pointer; filter:drop-shadow(0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.6)); }

.music-btn:not(.off) { filter:drop-shadow(0 0 calc(var(--u)*7) rgba(255,200,110,.6)) drop-shadow(0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.6)); }
.music-btn:active { transform:scale(.94); }

/* small carved-wood icon buttons + banner */
.wbtn { position:absolute; z-index:6; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#ffe3a3; padding:0;
  font-size:calc(var(--u)*34); border:calc(var(--u)*3) solid #d9a95a; border-radius:calc(var(--u)*14); background:linear-gradient(180deg,#8a5a2b,#4b2c12);
  box-shadow:0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.6), inset 0 calc(var(--u)*2) 0 rgba(255,225,160,.3); }

.banner { position:absolute; left:0; right:0; top:46%; z-index:70; display:flex; justify-content:center; pointer-events:auto; cursor:pointer; animation:bannerin .35s cubic-bezier(.2,1.3,.4,1) both; transition:opacity .45s; }
.banner.out { opacity:0; }
.banner span { padding:calc(var(--u)*20) calc(var(--u)*70); font-family:'Fraunces',Georgia,serif; font-weight:800; font-size:calc(var(--u)*44); letter-spacing:.02em; color:#ffe9b8; text-shadow:0 calc(var(--u)*2) 0 #2a1507;
  background:linear-gradient(180deg,#8a5a2b,#4b2c12); border-top:calc(var(--u)*4) solid #e3b866; border-bottom:calc(var(--u)*4) solid #e3b866; width:100%; text-align:center;
  box-shadow:0 calc(var(--u)*8) calc(var(--u)*24) rgba(0,0,0,.65), 0 0 calc(var(--u)*40) rgba(255,200,110,.35); }
@keyframes bannerin { from { transform:translateX(-12%) scaleY(.4); opacity:0 } to { transform:none; opacity:1 } }
.turn-text.bold { font-weight:800; font-size:calc(var(--u)*38); letter-spacing:.03em; color:#ffeec4; text-shadow:0 calc(var(--u)*2) 0 #2a1507, 0 0 calc(var(--u)*14) rgba(255,200,110,.5); }

.banner small { display:block; margin-top:calc(var(--u)*6); font-size:calc(var(--u)*22); font-weight:600; font-style:italic; color:#f0cf8c; letter-spacing:.04em; }
.banner span { display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*6); }
.banner small { font-size:calc(var(--u)*24); font-weight:600; font-style:italic; color:#f1d49a; letter-spacing:.04em; }
.turn-text.bold { width:auto; }

.game-title { font-family:'Fraunces',Georgia,serif; font-weight:600; color:#f6e7c4; letter-spacing:.01em; text-shadow:0 calc(var(--u)*2) calc(var(--u)*8) rgba(0,0,10,.85), 0 0 calc(var(--u)*18) rgba(255,220,150,.25); }

.loved-scroll { scrollbar-width:none; }
.loved-scroll::-webkit-scrollbar { display:none; }

.game-label { font-family:'Fraunces',Georgia,serif; font-weight:700; color:#3b2210; text-shadow:0 1px 0 rgba(255,235,190,.6); }

.kboard { background:conic-gradient(#8a5a33 0 25%, #f0d3a2 0 50%, #8a5a33 0 75%, #f0d3a2 0) 0 0/20% 20%; box-shadow:0 0 0 calc(var(--u)*3) #3a1c0b, inset 0 0 calc(var(--u)*14) rgba(0,0,0,.35); }
.kb-lbl { color:#f1d9a0; font-family:'Fraunces',Georgia,serif; font-weight:700; text-align:center; z-index:3; }

<body>
<script>
// ============================================================
// CORE: helpers, storage, picture-screen system, navigation
// ============================================================
'use strict';
const QS = new URLSearchParams(location.search);
const IS_LOCAL = ['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0;
const TEST_MODE = IS_LOCAL && QS.has('test');       // test helpers only ever on a local machine
if (QS.has('debug') && IS_LOCAL) document.body.classList.add('debug');

// ---- clock (can be moved forward in tests so 60-minute rules can be checked) ----
let CLOCK_SHIFT = 0;
function nowMs() { return Date.now() + CLOCK_SHIFT; }

// ---- small helpers ----
function $(id) { return document.getElementById(id); }

// GAME KIT shared by Chess and Checkers:
// computer-player helper (runs in the background so the screen never freezes),
// results history ("Stats"), 60-minute resume rule
// ============================================================
const RESUME_MS = 60 * 60 * 1000;
const PACE_MS = { easy: 2000, medium: 1000, hard: 0 };      // minimum time before the computer replies
const LEVEL_NAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

function makeAI(factory) {
  let w = null, id = 0, pending = {};
  const E = factory();
  function fallback() { const p = pending; pending = {}; Object.keys(p).forEach(k => { try { p[k].cb(E.bestMove(p[k].state, p[k].level)); } catch (e) { p[k].cb(null); } }); }
  try {
    const src = '(function(){var E=(' + factory.toString() + ')();onmessage=function(e){var m=e.data,r=null;try{r=E.bestMove(m.state,m.level,m.opts)}catch(x){}postMessage({id:m.id,move:r})}})()';
    w = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
    w.onmessage = (e) => { const f = pending[e.data.id]; if (!f) return; delete pending[e.data.id]; f.cb(e.data.move); };
    w.onerror = () => { w = null; fallback(); };
  } catch (err) { w = null; }
  return {
    E,
    ask(state, level, cb) {
      const myid = ++id; pending[myid] = { cb, state, level };
      if (w) w.postMessage({ id: myid, state, level });
      else setTimeout(() => { const f = pending[myid]; if (!f) return; delete pending[myid]; let m = null; try { m = E.bestMove(state, level); } catch (e) {} f.cb(m); }, 30);
    },
    cancel() { pending = {}; }
  };
}

const Results = {
  list(game) { return Store.get(game + ':stats', []); },
  add(game, result, level, extra) {
    const l = this.list(game); l.push(Object.assign({ r: result, d: level, t: nowMs() }, extra || {}));
    Store.set(game + ':stats', l.slice(-10));
  },
  counts(game) { const c = { won: 0, lost: 0, forfeited: 0, draw: 0 }; this.list(game).slice(-10).forEach(x => { if (c[x.r] != null) c[x.r]++; }); return c; }
};
const Totals = {
  get(game) { return Object.assign({ won: 0, lost: 0, forfeited: 0 }, Store.get(game + ':totals', {})); },
  bump(game, r) { const t = this.get(game); if (t[r] != null) t[r]++; Store.set(game + ':totals', t); }
};

const RESULT_WORD = { won: 'Won', lost: 'Lost', forfeited: 'Forfeited', draw: 'Draw' };

// saved game: {state, level, side, last (time of last move), undo:[...], capHuman:[], capComp:[]}
const Saved = {
  get(game) { return Store.get(game + ':game', null); },
  set(game, g) { Store.set(game + ':game', g); },

    } else addNav(S, { home: [24, 206, 192, 71], back: [24, 298, 192, 73] });
    const ly = withResume ? 806 : 610, lh = withResume ? 226 : 269;
    [['easy', withResume ? 150 : 152, 140], ['medium', withResume ? 352 : 350, 150], ['hard', withResume ? 561 : 565, 149]].forEach(([lv, x, w]) => addHot(S, x, ly, w, lh, () => ckPickLevel(lv), LEVEL_NAME[lv]));
    addHot(S, withResume ? 300 : 310, 1185, withResume ? 255 : 242, 250, () => go('ck-stats'), 'Stats');
    S.onShow = () => {
      if (S.sub) { const g = ckActive(); if (g) S.sub.textContent = LEVEL_NAME[g.level] + ' · ' + Saved.minsLeft(g) + ' min left'; }
      if (CK.justForfeited) { CK.justForfeited = false; go('ck-result-forfeit'); }
    };
  });
  // replace confirmation (picture)
  const R = defScreen('ck-replace', 'checkers-replace', { parent: 'ck-entry', name: 'Start a new game' });
  addHot(R, 27, 80, 194, 78, goHome, 'Home'); addHot(R, 245, 80, 185, 78, goBack, 'Back');
  addHot(R, 710, 72, 112, 89, goBack, 'Reset');
  addHot(R, 245, 677, 363, 73, () => go('ck-board', { resume: true }), 'Keep Current Game');
  addHot(R, 245, 766, 363, 76, () => { const old = Saved.get('checkers'); if (old && !old.over) { Results.add('checkers', 'forfeited', old.level); } Saved.clear('checkers'); ckStart(CK.pendingLevel); }, 'Start New Game');
  addTopMusic(R, 4);
  // board
  const B = defScreen('ck-board', 'checkers-board', { parent: 'ck-entry', name: 'Checkers board' });
  CK.S = B;
  addNav(B, { icons: true });
  B.undoTop = addIconBtn(B, 692, 246, 104, 'undo', ckUndoTap, 'Undo', 96);
  B.turnEl = addText(B, 'turn-text bold', 262, 248, 318, 76, 40, '');
  B.boardEl = el('div', 'kboard'); place(B.boardEl, 89, 430, 713, 713, B); B.art.appendChild(B.boardEl);
  B.capA = el('div', 'capture-row k'); place(B.capA, 125, 1302, 600, 42, B); B.art.appendChild(B.capA);
  B.capB = el('div', 'capture-row k'); place(B.capB, 125, 1347, 600, 42, B); B.art.appendChild(B.capB);
  for (let i = 0; i < 10; i++) {
    addText(B, 'kb-lbl', 49, 430 + i * 71.3 + 17, 40, 36, 26, String(10 - i));
    addText(B, 'kb-lbl', 89 + i * 71.3 + 17, 1148, 36, 40, 26, 'abcdefghij'[i]);
  }
  for (let i = 0; i < 100; i++) { const c = el('button', 'kcell'); c.type = 'button'; c.addEventListener('click', () => ckTap(i)); B.boardEl.appendChild(c); }
  B.onShow = (p) => ckShowBoard(p);
  B.onHide = () => { CK.gen++; CK.busy = false; if (CK.ai) CK.ai.cancel(); closePanel(B); };
  // result cards (pictures)
  [['won', 'checkers-won'], ['lost', 'checkers-lost'], ['draw', 'checkers-draw'], ['forfeit', 'checkers-forfeit']].forEach(([k, pic]) => {
    const S = defScreen('ck-result-' + k, pic, { parent: 'ck-entry', name: 'Checkers result' });
    S.plaque = addText(S, 'plaque', 352, 712, 196, 42, 28, '');
    addHot(S, 229, 785, 440, 94, () => go('ck-entry'), 'Checkers Home'); addMusic(S, 764, 36);
    S.onShow = () => { S.plaque.textContent = CK.lastLevel ? LEVEL_NAME[CK.lastLevel] : ''; };
  });
  // stats
  const T = defScreen('ck-stats', 'checkers-stats', { parent: 'ck-entry', name: 'Checkers stats' });
  addNav(T, { home: [39, 113, 206, 77], back: [39, 206, 206, 76] });
  T.statEls = [];
  T.onShow = () => paintStats(T, 'checkers', { tiles: [[420, 668, 140, 80], [680, 668, 130, 80], [420, 834, 140, 80], [680, 834, 130, 80]], numFs: 54, rowX: 374, rowY: 995, rowW: 439, rowH: 49.6, rowFs: 24 });
  Ticker.fns.add(ckTick);
}
function ckActive() { const g = Saved.get('checkers'); return g && !Saved.expired(g) ? g : null; }
function ckExpireIfNeeded() {
  const g = Saved.get('checkers');
  if (g && Saved.expired(g) && !g.over) { Results.add('checkers', 'forfeited', g.level); CK.lastLevel = g.level; Saved.clear('checkers'); CK.justForfeited = true; }
}
function ckPickLevel(level) {
  CK.pendingLevel = level;
  if (ckActive()) go('ck-replace'); else ckStart(level);
}
function ckStart(level) {
  CK.G = { state: CK.E.initialState(), level: level || 'easy', last: nowMs(), undo: [], capHuman: [], capComp: [], over: false };
  Saved.set('checkers', CK.G); go('ck-board', { fresh: true });
}
function ckShowBoard() {
  const S = CK.S; closePanel(S); S.art.classList.remove('dim');
  CK.sel = null; CK.cands = []; CK.step = 0; CK.busy = false;
  ckExpireIfNeeded();
  const g = Saved.get('checkers');
  if (!g) { go('ck-entry'); return; }
  CK.G = g; ckRender(); ckAfterMove();
}
function ckRender() {
  const S = CK.S, G = CK.G, E = CK.E, st = G.state, cells = S.boardEl.children;
  const sts = E.status(st), last = st.lastMove;
  // squares to highlight as destinations
  const dest = {};
  if (CK.sel != null) CK.cands.forEach(m => { const sq = CK.step === 0 ? m.to : m.path[CK.step]; dest[sq] = 1; });
  for (let i = 0; i < 100; i++) {
    const r = Math.floor(i / 10), c = i % 10, p = st.board[i], c0 = cells[i];
    let cls = 'kcell';
    if ((r + c) % 2 === 1) cls += ' dark';
    if (CK.sel === i) cls += ' sel';
    if (dest[i]) cls += sts.mustCapture ? ' dest must' : ' dest';
    if (last && (last.path ? (last.path[0] === i || last.to === i) : false)) cls += ' last';
    c0.className = cls; c0.innerHTML = p ? ckPieceSVG(p) : '';
  }
  const draw = (box, arr) => { box.innerHTML = ''; arr.forEach(code => box.appendChild(el('span', 'cap', ckPieceSVG(code)))); };
  draw(S.capA, G.capHuman); draw(S.capB, G.capComp);
  let main = '';
  if (!G.over) main = st.turn === 'w' ? 'Your Turn' : 'Computer Thinking';
  S.turnEl.textContent = main; S.turnEl.style.fontSize = 'calc(var(--u) * ' + (main.length > 10 ? 29 : 38) + ')';
  // "You must capture": a banner shown once each time a capture becomes compulsory
  const must = !G.over && st.turn === 'w' && sts.mustCapture;
  if (must && S.lastMust !== st) showBanner(S, 'You must capture');
  if (!must) hideBanner(S);
  S.lastMust = must ? st : null;
  S.undoTop.style.display = G.level === 'easy' ? '' : 'none';
  const can = ckCanUndo(); S.undoTop.classList.toggle('off', !can); S.undoTop.disabled = !can;
}
function ckTap(i) {
  const G = CK.G; if (!G || G.over || CK.busy) return;
  const st = G.state, E = CK.E; if (st.turn !== 'w') return;
  if (CK.sel != null) {
    const sq = i;
    const next = CK.step === 0 ? CK.cands.filter(m => m.to === sq) : CK.cands.filter(m => m.path[CK.step] === sq);
    if (next.length) {
      if (next.length === 1) { ckHumanMove(next[0]); return; }
      if (CK.step === 0) { CK.cands = next; CK.step = 1; ckRender(); return; }   // several routes end here: pick the route square by square
      if (next.every(m => m.path.length - 1 === CK.step)) { ckHumanMove(next[0]); return; }
      CK.cands = next; CK.step++; ckRender(); return;
    }
  }
  const mine = E.legalMoves(st).filter(m => m.from === i);
  if (mine.length) { CK.sel = i; CK.cands = mine; CK.step = 0; } else { CK.sel = null; CK.cands = []; CK.step = 0; }
  ckRender();
}
function ckHumanMove(m) {
  const G = CK.G, E = CK.E;
  if (G.level === 'easy') G.undo.push({ state: G.state, capHuman: G.capHuman.slice(), capComp: G.capComp.slice() });   // every move is kept so Undo can go all the way back
  m.captured.forEach(sq => G.capHuman.push(G.state.board[sq]));
  G.state = E.applyMove(G.state, m); G.last = nowMs(); CK.sel = null; CK.cands = []; CK.step = 0;
  Saved.set('checkers', G); ckRender(); ckAfterMove();
}
function ckAfterMove() {
  const G = CK.G, E = CK.E; if (!G || G.over) return;
  const sts = E.status(G.state);
  if (sts.over) { ckEnd(sts); return; }
  if (G.state.turn === 'b') ckComputer();
}
function ckComputer() {
  const G = CK.G, gen = ++CK.gen; CK.busy = true; ckRender();
  const t0 = Date.now(), level = G.level;
  CK.ai.ask(G.state, level, (mv) => {
    const wait = Math.max(0, PACE_MS[level] - (Date.now() - t0));
    setTimeout(() => {
      if (gen !== CK.gen || CK.G !== G || G.over) return;
      CK.busy = false;
      if (!mv) { ckAfterMove(); return; }
      mv.captured.forEach(sq => G.capComp.push(G.state.board[sq]));
      G.state = CK.E.applyMove(G.state, mv); G.last = nowMs(); Saved.set('checkers', G); ckRender(); ckAfterMove();
    }, wait);
  });
}
function ckEnd(sts) {
  const G = CK.G; G.over = true; CK.busy = false; CK.gen++;
  let res = 'draw';
  if (sts.result === 'loss') res = sts.winner === 'w' ? 'won' : 'lost';
  Results.add('checkers', res, G.level); CK.lastLevel = G.level; Saved.clear('checkers');
  ckRender();
  setTimeout(() => { if (CK.G === G && CUR === 'ck-board') go('ck-result-' + res); }, 900);
}
function ckReset() {
  const G = CK.G;
  if (!G || G.over) { go('ck-entry'); return; }
  CK.pendingLevel = G.level; go('ck-replace');
}
function ckCanUndo() { const G = CK.G; return !!(G && !G.over && !CK.busy && G.level === 'easy' && G.undo.length && G.state.turn === 'w'); }
function ckUndoTap() { if (ckCanUndo()) ckUndo(); }
function ckUndo() {
  const G = CK.G; if (!G || G.over || CK.busy || G.level !== 'easy' || !G.undo.length) return;
  const u = G.undo.pop(); G.state = u.state; G.capHuman = u.capHuman; G.capComp = u.capComp; G.last = nowMs();
  CK.sel = null; CK.cands = []; CK.step = 0; Saved.set('checkers', G); ckRender();
}
function ckTick() {
  const S = CK.S; if (!S) return;
  if (S.el.classList.contains('active') && CK.G && !CK.G.over && Saved.expired(CK.G)) {
    const G = CK.G; G.over = true; CK.gen++; CK.busy = false;
    Results.add('checkers', 'forfeited', G.level); CK.lastLevel = G.level; Saved.clear('checkers');
    ckRender(); S.art.classList.add('dim'); go('ck-result-forfeit');
  }
  const E = SCREENS['ck-entry-r'];
  if (E && E.el.classList.contains('active') && E.sub) { const g = ckActive(); if (g) E.sub.textContent = LEVEL_NAME[g.level] + ' · ' + Saved.minsLeft(g) + ' min left'; else go('ck-entry'); }
}

// ============================================================
// START-UP
// ============================================================
function bootApp() {
  buildHome(); buildGames(); buildLoved(); buildBubble(); buildMine(); buildChess(); buildCheckers();
  Music.armFirstTap();
  Music.paint();
  goHome();                                   // no sign-in: open straight onto Home
  // prevent double-tap zoom
  let lastTap = 0;
  document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTap < 300 && e.target.closest && !e.target.closest('input,textarea,select')) e.preventDefault(); lastTap = n; }, { passive: false });
  if (TEST_MODE) window.MM = { go, goHome, goBack, SCREENS, CH, CK, BUB, MS, Store, Saved, Results, advance: (ms) => { CLOCK_SHIFT += ms; }, nowMs, Music, get cur() { return CUR; } };
}

bootApp();
</script>
